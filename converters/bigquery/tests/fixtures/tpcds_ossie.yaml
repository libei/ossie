# A trimmed TPC-DS star used as the export golden fixture. Every object that can
# carry semantic metadata -- the model, each node, every property, each edge,
# and every measure -- declares a `description` and a structured `ai_context`
# (synonyms), so the fixture doubles as a showcase of how Ossie's AI context
# maps onto BigQuery's native graph OPTIONS(description=..., synonyms=[...]). It
# also exercises: a composite node KEY, single-column edges, a computed-field
# property, a single-table metric (-> MEASURE), and a cross-dataset metric
# (-> skipped with a warning).

version: "0.2.0.dev0"

semantic_model:
  - name: tpcds_retail_model
    description: TPC-DS retail semantic model
    ai_context:
      synonyms:
        - retail analytics
        - store sales model

    datasets:
      - name: store_sales
        source: tpcds.public.store_sales
        primary_key: [ss_item_sk, ss_ticket_number]
        description: Store sales fact table
        ai_context:
          synonyms:
            - sales transactions
            - POS data
        fields:
          - name: ss_item_sk
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: ss_item_sk
            description: Foreign key to item
            ai_context:
              synonyms:
                - item key
                - product key
          - name: ss_customer_sk
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: ss_customer_sk
            description: Foreign key to customer
            ai_context:
              synonyms:
                - customer key
                - buyer key
          - name: ss_ext_sales_price
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: ss_ext_sales_price
            description: Extended sales price
            ai_context:
              synonyms:
                - line revenue
                - extended price
          - name: ss_net_profit
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: ss_net_profit
            description: Net profit for the line item
            ai_context:
              synonyms:
                - line margin
                - profit

      - name: customer
        source: tpcds.public.customer
        primary_key: [c_customer_sk]
        description: Customer dimension
        ai_context:
          synonyms:
            - customers
            - shoppers
        fields:
          - name: c_customer_sk
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: c_customer_sk
            description: Customer surrogate key
            ai_context:
              synonyms:
                - customer id
          - name: c_first_name
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: c_first_name
            description: Customer first name
            ai_context:
              synonyms:
                - given name
          - name: c_last_name
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: c_last_name
            description: Customer last name
            ai_context:
              synonyms:
                - surname
                - family name
          - name: customer_full_name
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: c_first_name || ' ' || c_last_name
            description: Customer full name (computed)
            ai_context:
              synonyms:
                - full name

      - name: item
        source: tpcds.public.item
        primary_key: [i_item_sk]
        description: Item dimension
        ai_context:
          synonyms:
            - products
            - catalog
        fields:
          - name: i_item_sk
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: i_item_sk
            description: Item surrogate key
            ai_context:
              synonyms:
                - item id
                - product id
          - name: i_brand
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: i_brand
                - dialect: ANSI_SQL
                  expression: i_brand
            description: Brand name
            ai_context:
              synonyms:
                - manufacturer brand
                - label

    relationships:
      - name: store_sales_to_customer
        from: store_sales
        to: customer
        from_columns: [ss_customer_sk]
        to_columns: [c_customer_sk]
        ai_context:
          synonyms:
            - who bought
            - purchased by
      - name: store_sales_to_item
        from: store_sales
        to: item
        from_columns: [ss_item_sk]
        to_columns: [i_item_sk]
        ai_context:
          synonyms:
            - what was sold
            - product sold

    metrics:
      - name: total_sales
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(store_sales.ss_ext_sales_price)
        description: Total sales revenue
        ai_context:
          synonyms:
            - gross sales
            - total revenue
      - name: total_profit
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(store_sales.ss_net_profit)
        description: Total net profit
        ai_context:
          synonyms:
            - total margin
            - net profit
      - name: customer_lifetime_value
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(store_sales.ss_ext_sales_price) / COUNT(DISTINCT customer.c_customer_sk)
        description: Cross-dataset ratio; not a single MEASURE
        ai_context:
          synonyms:
            - CLV
            - lifetime value
