# A many-to-many graph: a student can enroll in many courses, and a course can
# hold many students. A plain foreign key cannot express that -- it would pin
# each enrollment to one side -- so the link lives in its own junction table,
# `enrollment`, with one row per (student, course) pair. BigQuery models that
# junction as an EDGE TABLE whose SOURCE and DESTINATION keys both sit on the
# junction and REFERENCE two different nodes.
#
# The core spec has no slot for a junction table on a relationship yet, so it is
# declared -- next to the edge properties (grade, enrolled_on) that describe the
# link itself -- in the same Google-owned `custom_extensions` entry, under an
# `association` object. The relationship's own `from_columns`/`to_columns` stay
# the referenced key columns on the two nodes; `association.source_key` and
# `association.destination_key` are the junction table's own foreign keys, which
# here are deliberately named differently (`s_id`, `c_id`) to show that the
# junction's columns and the nodes' keys are distinct.

version: "0.2.0.dev0"

semantic_model:
  - name: enrollments_graph
    description: Students and the courses they enroll in
    ai_context:
      synonyms:
        - course enrollment graph
        - registrations

    datasets:
      - name: student
        source: campus.public.student
        primary_key: [student_id]
        description: A person enrolled at the school
        ai_context:
          synonyms:
            - students
            - learners
        fields:
          - name: student_id
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: student_id
            description: Unique identifier for the student
          - name: student_name
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: student_name
            description: Student full name
            ai_context:
              synonyms:
                - name

      - name: course
        source: campus.public.course
        primary_key: [course_id]
        description: A course students can enroll in
        ai_context:
          synonyms:
            - courses
            - classes
        fields:
          - name: course_id
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: course_id
            description: Unique identifier for the course
          - name: title
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: title
            description: Course title

    relationships:
      - name: enrolled_in
        from: student
        to: course
        from_columns: [student_id]
        to_columns: [course_id]
        ai_context:
          synonyms:
            - takes
            - registered for
        custom_extensions:
          - vendor_name: GOOGLE
            data: |
              {
                "association": {
                  "table": "campus.public.enrollment",
                  "source_key": ["s_id"],
                  "destination_key": ["c_id"],
                  "key": ["s_id", "c_id"]
                },
                "fields": [
                  {
                    "name": "grade",
                    "expression": {
                      "dialects": [
                        {"dialect": "BIGQUERY", "expression": "grade"}
                      ]
                    },
                    "description": "Final grade the student earned",
                    "ai_context": {"synonyms": ["mark", "score"]}
                  },
                  {
                    "name": "enrolled_on",
                    "expression": {
                      "dialects": [
                        {"dialect": "BIGQUERY", "expression": "enrolled_on"}
                      ]
                    },
                    "description": "Date the student enrolled in the course",
                    "ai_context": {"synonyms": ["enrollment date"]}
                  }
                ]
              }
