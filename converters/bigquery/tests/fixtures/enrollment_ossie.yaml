# A many-to-many graph, expressed with a first-class edge. A student can enroll
# in many courses and a course can hold many students; a foreign key cannot say
# that, so the link lives in its own table, `enrollment` (one row per (student,
# course) pair). In BigQuery an EDGE TABLE is structurally a NODE TABLE plus two
# endpoints: it has its own backing table, KEY, and PROPERTIES, then a SOURCE KEY
# and a DESTINATION KEY that each REFERENCE a node. So the edge is modeled here
# exactly like a dataset -- it has a `source`, a `primary_key`, and `fields` --
# plus a `source_key`/`destination_key` saying where it connects.
#
# The core spec has no first-class edge slot yet, so the `edges` list rides in a
# model-level Google-owned `custom_extensions` entry, shaped as a future
# spec-native `edges:` (a sibling of `datasets:`) would be. Each endpoint reads
# left to right as its DDL clause: `columns` are the edge's own key columns, and
# they REFERENCE `node` (`references`). `references` defaults to that node's
# primary_key and is spelled out here only to be explicit; the junction's own
# columns (`s_id`, `c_id`) are deliberately named differently from the nodes'
# keys to show that the two are distinct.

version: "0.2.0.dev0"

semantic_model:
  - name: enrollment_graph
    description: Students and the courses they enroll in
    ai_context:
      synonyms:
        - course enrollment graph
        - registrations

    datasets:
      - name: student
        source: campus.public.student
        primary_key: [student_id]
        description: A person enrolled at the school
        ai_context:
          synonyms:
            - students
            - learners
        fields:
          - name: student_id
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: student_id
            description: Unique identifier for the student
          - name: student_name
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: student_name
            description: Student full name
            ai_context:
              synonyms:
                - name

      - name: course
        source: campus.public.course
        primary_key: [course_id]
        description: A course students can enroll in
        ai_context:
          synonyms:
            - courses
            - classes
        fields:
          - name: course_id
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: course_id
            description: Unique identifier for the course
          - name: title
            expression:
              dialects:
                - dialect: BIGQUERY
                  expression: title
            description: Course title

    # The many-to-many edge, modeled like a dataset (its own source, key, and
    # fields) plus two endpoints. Carried in a model-level Google extension until
    # the core spec grows a first-class `edges:` list.
    custom_extensions:
      - vendor_name: GOOGLE
        data: |
          {
            "edges": [
              {
                "name": "enrolled_in",
                "source": "campus.public.enrollment",
                "primary_key": ["s_id", "c_id"],
                "description": "A student's enrollment in a course",
                "ai_context": {"synonyms": ["takes", "registered for"]},
                "source_key": {
                  "columns": ["s_id"],
                  "node": "student",
                  "references": ["student_id"]
                },
                "destination_key": {
                  "columns": ["c_id"],
                  "node": "course",
                  "references": ["course_id"]
                },
                "fields": [
                  {
                    "name": "grade",
                    "expression": {
                      "dialects": [
                        {"dialect": "BIGQUERY", "expression": "grade"}
                      ]
                    },
                    "description": "Final grade the student earned",
                    "ai_context": {"synonyms": ["mark", "score"]}
                  },
                  {
                    "name": "enrolled_on",
                    "expression": {
                      "dialects": [
                        {"dialect": "BIGQUERY", "expression": "enrolled_on"}
                      ]
                    },
                    "description": "Date the student enrolled in the course",
                    "ai_context": {"synonyms": ["enrollment date"]}
                  }
                ]
              }
            ]
          }
